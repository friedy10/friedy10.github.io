<!-- Lightbox. Progressive enhancement: with JS off, each thumbnail is just a
     link to the full-size image, which works fine. -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" type="button" aria-label="Close">Close</button>
  <button class="lb-nav lb-prev" type="button" aria-label="Previous photo">&#8249;</button>
  <img class="lb-img" alt="">
  <button class="lb-nav lb-next" type="button" aria-label="Next photo">&#8250;</button>
  <p class="lb-count" aria-live="polite"></p>
</div>

<script>
(function () {
  var shots = Array.prototype.slice.call(document.querySelectorAll('.shot'));
  if (!shots.length) return;
  var box   = document.getElementById('lightbox'),
      img   = box.querySelector('.lb-img'),
      count = box.querySelector('.lb-count'),
      prev  = box.querySelector('.lb-prev'),
      next  = box.querySelector('.lb-next'),
      close = box.querySelector('.lb-close'),
      i = 0, lastFocus = null;

  function show(n) {
    i = (n + shots.length) % shots.length;
    var a = shots[i];
    img.src = a.getAttribute('href');
    img.alt = a.querySelector('img').alt;
    count.textContent = (i + 1) + ' / ' + shots.length;
  }
  function open(n, from) {
    lastFocus = from || null;
    box.hidden = false;
    document.body.style.overflow = 'hidden';
    show(n);
    close.focus();
  }
  function shut() {
    box.hidden = true;
    img.removeAttribute('src');
    document.body.style.overflow = '';
    if (lastFocus) lastFocus.focus();
  }

  shots.forEach(function (a, n) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      open(n, a);
    });
  });
  close.addEventListener('click', shut);
  prev.addEventListener('click', function () { show(i - 1); });
  next.addEventListener('click', function () { show(i + 1); });
  box.addEventListener('click', function (e) { if (e.target === box) shut(); });
  document.addEventListener('keydown', function (e) {
    if (box.hidden) return;
    if (e.key === 'Escape') shut();
    else if (e.key === 'ArrowLeft') show(i - 1);
    else if (e.key === 'ArrowRight') show(i + 1);
  });
})();
</script>
